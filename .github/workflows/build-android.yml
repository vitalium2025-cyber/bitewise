name: Build Android AAB (Play Billing enabled)

on:
  workflow_dispatch: {}

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Bubblewrap CLI
        run: npm install -g @bubblewrap/cli

      - name: Decode signing keystore
        run: |
          echo "${{ secrets.ANDROID_KEYSTORE_BASE64 }}" | base64 -d > android.keystore

      - name: Install Android SDK
        uses: android-actions/setup-android@v3

      - name: Configure Bubblewrap
        run: |
          mkdir -p ~/.bubblewrap
          cat > ~/.bubblewrap/config.json << EOF
          {
            "jdkPath": "${JAVA_HOME}",
            "androidSdkPath": "${ANDROID_HOME}"
          }
          EOF
          echo "Using JAVA_HOME=${JAVA_HOME}"
          echo "Using ANDROID_HOME=${ANDROID_HOME}"

      - name: Fetch and display manifest.json for debugging
        run: |
          curl -sL "https://vitalium2025-cyber.github.io/bitewise/manifest.json" -o /tmp/manifest.json
          cat /tmp/manifest.json

      - name: Initialize Bubblewrap project from live PWA manifest
        run: |
          timeout 150 bash -c 'yes "" | bubblewrap init \
            --manifest="https://vitalium2025-cyber.github.io/bitewise/manifest.json" \
            --directory="./twa-project" \
            --skipPwaValidation' || echo "init exited $? (continuing — project files are likely already written)"
          test -f ./twa-project/twa-manifest.json && echo "twa-manifest.json exists, continuing" || (echo "FATAL: twa-manifest.json missing, cannot continue" && exit 1)

      - name: Patch twa-manifest.json (package id, signing key, Play Billing, version)
        run: |
          cd twa-project
          node -e "
            const fs = require('fs');
            const m = JSON.parse(fs.readFileSync('twa-manifest.json', 'utf8'));
            m.packageId = 'app.bitewise.calorietracker';
            m.host = 'vitalium2025-cyber.github.io';
            m.startUrl = '/bitewise/bitewise.html';
            m.signingKey = { path: '../android.keystore', alias: '${{ secrets.KEY_ALIAS }}' };
            m.appVersionCode = 10;
            m.appVersionName = '1.5.0.0';
            m.features = m.features || {};
            m.features.playBilling = { enabled: true };
            fs.writeFileSync('twa-manifest.json', JSON.stringify(m, null, 2));
          "
          echo "--- Patched twa-manifest.json ---"
          cat twa-manifest.json

      - name: Regenerate Android project from patched manifest
        run: |
          cd twa-project
          timeout 150 bash -c 'yes "" | bubblewrap update --skipPwaValidation' || echo "update exited $? (continuing — checking if project files were regenerated)"
          echo "--- Verify applicationId ---"
          grep -r "applicationId" app/build.gradle || echo "applicationId not found"
          echo "--- Verify versionCode ---"
          grep -r "versionCode" app/build.gradle || echo "versionCode not found"
          echo "--- Verify Play Billing dependency ---"
          grep -r "billing" app/build.gradle || echo "billing dependency not found"

      - name: Build signed AAB
        env:
          BUBBLEWRAP_KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          BUBBLEWRAP_KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          cd twa-project
          timeout 300 bash -c 'bubblewrap build --skipPwaValidation <<< $"${{ secrets.KEYSTORE_PASSWORD }}\n${{ secrets.KEY_PASSWORD }}\n"'
          find . -name "*.aab" -exec ls -la {} \;

      - name: Upload AAB artifact
        uses: actions/upload-artifact@v4
        with:
          name: bitewise-release-aab
          path: twa-project/app-release-bundle.aab
