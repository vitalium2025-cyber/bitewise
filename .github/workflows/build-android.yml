name: Build Android AAB (Play Billing enabled)

on:
  workflow_dispatch: {}

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Bubblewrap CLI
        run: npm install -g @bubblewrap/cli

      - name: Decode signing keystore
        run: |
          echo "${{ secrets.ANDROID_KEYSTORE_BASE64 }}" | base64 -d > android.keystore

      - name: Install Android SDK
        uses: android-actions/setup-android@v3

      - name: Configure Bubblewrap (accept JDK/SDK auto-install)
        run: |
          mkdir -p ~/.bubblewrap
          cat > ~/.bubblewrap/config.json << EOF
          {
            "jdkPath": "${JAVA_HOME}",
            "androidSdkPath": "${ANDROID_HOME}"
          }
          EOF
          echo "Using JAVA_HOME=${JAVA_HOME}"
          echo "Using ANDROID_HOME=${ANDROID_HOME}"
          cat ~/.bubblewrap/config.json

      - name: Fetch and display manifest.json for debugging
        run: |
          curl -sL "https://vitalium2025-cyber.github.io/bitewise/manifest.json" -o /tmp/manifest.json
          echo "--- manifest.json content ---"
          cat /tmp/manifest.json
          echo "--- end manifest.json ---"

      - name: Initialize Bubblewrap project from live PWA manifest
        run: |
          timeout 180 bash -c 'yes "" | bubblewrap init \
            --manifest="https://vitalium2025-cyber.github.io/bitewise/manifest.json" \
            --directory="./twa-project" \
            --skipPwaValidation' || echo "init step exited with code $? (may have timed out)"
          echo "--- twa-project contents ---"
          ls -la ./twa-project || echo "twa-project directory was not created"
          echo "--- twa-manifest.json (if present) ---"
          cat ./twa-project/twa-manifest.json 2>/dev/null || echo "twa-manifest.json not found"

      - name: Patch twa-manifest.json (package id, signing key, Play Billing, version bump)
        run: |
          cd twa-project
          node -e "
            const fs = require('fs');
            const m = JSON.parse(fs.readFileSync('twa-manifest.json', 'utf8'));
            m.packageId = 'app.bitewise.calorietracker';
            m.host = 'vitalium2025-cyber.github.io';
            m.startUrl = '/bitewise/bitewise.html';
            m.signingKey = { path: '../android.keystore', alias: '${{ secrets.KEY_ALIAS }}' };
            m.appVersionCode = 10;
            m.appVersionName = '1.5.0.0';
            m.features = m.features || {};
            m.features.playBilling = { enabled: true };
            fs.writeFileSync('twa-manifest.json', JSON.stringify(m, null, 2));
          "
          echo "--- Patched twa-manifest.json ---"
          cat twa-manifest.json

      - name: Regenerate Android project from patched manifest
        run: |
          cd twa-project
          yes "" | bubblewrap update --skipPwaValidation || echo "update step exited with code $?"
          echo "--- Verify applicationId in build.gradle ---"
          grep -r "applicationId" app/build.gradle || echo "applicationId not found in build.gradle"
          echo "--- Verify versionCode in build.gradle ---"
          grep -r "versionCode" app/build.gradle || echo "versionCode not found in build.gradle"

      - name: Build signed AAB
        env:
          BUBBLEWRAP_KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          BUBBLEWRAP_KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          cd twa-project
          bubblewrap build \
            --skipPwaValidation \
            <<< $'${{ secrets.KEYSTORE_PASSWORD }}\n${{ secrets.KEY_PASSWORD }}\n'

      - name: Upload AAB artifact
        uses: actions/upload-artifact@v4
        with:
          name: bitewise-release-aab
          path: twa-project/app-release-bundle.aab
